# Keep the infrastructure lifecycle independent from docker-compose.yml.
name: service-observability

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: service-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Local-only stack: no TLS or authentication. Never expose this setup publicly.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      observability:

  tempo:
    image: grafana/tempo:2.7.2
    container_name: service-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      observability:

  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    container_name: service-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      observability:

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: service-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      observability:

  grafana:
    image: grafana/grafana:11.6.0
    container_name: service-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_LOG_INDEX: ${OPENSEARCH_LOG_INDEX:-service-logs}
      OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-2.19.1}
      OPENSEARCH_BASIC_AUTH: ${OPENSEARCH_BASIC_AUTH:-false}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      TEMPO_URL: ${TEMPO_URL:-http://tempo:3200}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      observability:

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK:-service-observability}

volumes:
  grafana-data:
  opensearch-data:
  prometheus-data:
  tempo-data:
