schemas:
  # --- Ошибки ---
  respond.ErrorResponse:
    "": "Ошибка HTTP API. Действие по code — в каталоге ошибок docs/error-codes.yaml."
    code: "Машиночитаемый код ошибки. Список кодов с HTTP-статусом, смыслом и действием агента — в каталоге docs/error-codes.yaml (github.com/endge-lab/service-backend) и на странице ошибок документации Endge."
    message: "Безопасное сообщение для человека; может меняться, поэтому решения принимайте по code."
  shared.ErrorResponse:
    "": "Ошибка HTTP API. Действие по code — в каталоге ошибок docs/error-codes.yaml."
    code: "Машиночитаемый код ошибки. Список кодов с HTTP-статусом, смыслом и действием агента — в каталоге docs/error-codes.yaml (github.com/endge-lab/service-backend) и на странице ошибок документации Endge."
    message: "Безопасное сообщение для человека; может меняться, поэтому решения принимайте по code."
  mcp.JSONRPCError:
    code: "Код ошибки JSON-RPC (например, -32602 — неверные параметры). Ошибки инструментов приходят не здесь, а в result с isError и полем error, равным code HTTP API."
    message: "Сообщение об ошибке протокола."
  mcp.JSONRPCRequest:
    id: "Идентификатор запроса JSON-RPC; ответ приходит с тем же id. Для уведомлений не передаётся."
  mcp.JSONRPCResponse:
    id: "Идентификатор запроса JSON-RPC, на который это ответ."

  # --- Коммиты и релизы ---
  commit.CreateRequest:
    message: "Сообщение коммита (до 1000 символов)."
  commit.Response:
    message: "Сообщение коммита."
  release.RestoreResponse:
    message: "Сообщение коммита, созданного восстановлением."
  "*.ReorderRequest":
    items: "Полный упорядоченный список identity фасетов; должен совпадать с текущим набором."

  # --- Сессия и пользователи ---
  session.AccessManagementResponse:
    mode: "local — права назначаются в Endge; external — права приходят из групп провайдера OIDC и в Endge не меняются."
  session.UserResponse:
    id: "UUID пользователя Endge."
  entities.Actor:
    id: "UUID пользователя Endge."
  session.WorkspaceResponse:
    identity: "identity workspace; передавайте его в заголовке X-Endge-Workspace."
  "workspace.*":
    identity: "identity workspace (уникален в платформе); передавайте его в заголовке X-Endge-Workspace."
    version: "Версия установленной интеграции."
  workspace.ArchiveItemResponse:
    deletedAt: "Время удаления workspace (RFC 3339)."
  "access_control.*":
    user: "Пользователь, которому назначен доступ."
  entities.AIMessage:
    role: "Автор сообщения AI-диалога: user или assistant."
    sequence: "Порядковый номер сообщения в диалоге."
    content: "Текст сообщения."

  # --- Персональные токены ---
  "access_token.*":
    name: "Имя токена для людей (1–120 символов), например имя агента и задачи."
    scope: "read — только чтение; write — чтение и изменение документов (нужна роль Editor)."
    status: "Состояние токена: active, expired или revoked."
    owner: "Пользователь, выпустивший токен; права токена не шире его прав в workspace."
    workspaceIdentity: "identity workspace, в котором действует токен."
    expiresAt: "Время истечения токена (RFC 3339); обязателен при выпуске, не больше максимального срока."
    description: "Описание назначения токена (до 1000 символов)."

  # --- Документы и папки ---
  "build_profile.*":
    identity: "UUID профиля сборки."
  entities.BuildProfile:
    identity: "UUID профиля сборки."
  entities.PortableBuildProfile:
    identity: "UUID профиля сборки."
  "folder.*":
    scope: "Область папки: collection — папка коллекции (задан entityType), workspace — свободная папка workspace."
  "composition.*":
    kind: "Вид композиции: library, query или workspace."
  "vocab.*":
    mode: "Режим справочника: internal — данные в source, external_payload — данные из внешнего API (baseApiUrl, collectionSlug)."
  "action.*":
    target: "Цель действия (JSON-объект)."
    owner: "Владелец действия (JSON-объект)."
  "document_move.*":
    documents: "Перемещаемые документы: коллекция и identity (от 1 до 500)."
  "facet.*":
    configuration: "Вклад в конфигурацию: mode inherit (объектный patch поверх родителя) или replace (полная замена)."
  "integration.*":
    version: "Версия интеграции."
  entities.ArchivedDocument:
    type: "Коллекция удалённого документа."
  access_control.BulkSelectionRequest:
    type: "Способ выбора workspace: all-active — все активные, selected — перечисленные в workspaceIdentities."
  access_control.BulkRequest:
    selection: "Какие workspace затрагивает массовое назначение."

  # --- Экспорт, импорт, резервные копии ---
  "backup.*":
    kind: "Вид резервной копии: manual — вручную, pre_import — автоматически перед импортом."
  "*.ExportResponse":
    kind: "Вид переносимого снимка (экспорт workspace)."
    workspace: "Настройки workspace в снимке."
    documents: "Документы снимка по коллекциям."
  domain.ImportResponse:
    workspace: "Состояние workspace после импорта."
  entities.DomainStatus:
    workspace: "identity workspace."
    state: "clean — нет незакоммиченных ревизий (domainVersion совпадает с последним коммитом); dirty — есть изменения после последнего коммита."
    domainVersion: "domainVersion текущего состояния; заполняется только при state=clean."
  entities.SnapshotCounts:
    documents: "Количество документов."

  # --- Сборки и релизы ---
  entities.ReleaseBuildMetadata:
    profile: "Профиль сборки, которым собран бандл."
    scope: "Область сборки."
    version: "Версия формата метаданных сборки."
    runtime: "Среда выполнения сборки."
  entities.BuildProfileTopologyNode:
    runtime: "Среда выполнения узла."

  # --- Mock Generator ---
  "mock_data.*":
    profile: "Профиль генерации данных."
    count: "Сколько записей сгенерировать."
    selection: "Выборка записей источника связи."
  mock_data.Relation:
    id: "Идентификатор связи."
    source: "Источник связи: коллекция и путь поля."
    target: "Цель связи: коллекция и путь поля."
  entities.MockStream:
    id: "Идентификатор потока."
    status: "Состояние потока."
    sequence: "Номер последнего отправленного сообщения."
    profile: "Профиль генерации данных."

  # --- AI ---
  "ai_catalog.*":
    name: "Имя AI-подключения."
    model: "Профиль AI-модели."
  entities.AIProviderConnection:
    name: "Имя AI-подключения."
  entities.PortableAIConnection:
    name: "Имя AI-подключения."
    models: "Профили моделей подключения."
  "ai_assistant.*":
    model: "Профиль AI-модели диалога."
    adapters: "Адаптеры AI-провайдеров, доступные на установке."
  entities.AIConversation:
    model: "Профиль AI-модели диалога."

  # --- Сервис ---
  "health.*":
    status: "Состояние сервиса: ok или unavailable."
    version: "Версия сервиса (APP_VERSION)."
