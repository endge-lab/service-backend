# Словарь описаний OpenAPI для агентов (поддерживается вручную).
#
# internal/tools/openapienrich применяет его к docs/openapi3.yaml в `make docs`:
#   properties — описание свойства по имени во всех схемах;
#   schemas    — переопределения для схемы (точное имя или шаблон вида composition.*), ключ "" — описание схемы;
#   описания из аннотаций кода не перезаписываются.
# Инструмент падает, если у свойства нет описания или запись словаря ничему не соответствует.
# Описания пишутся по коду backend, а не по названию поля.

info:
  description: |
    Версия документа совпадает с APP_VERSION backend (файл VERSION).

    Для агентов: аутентификация — заголовок Authorization: Bearer с JWT access token провайдера OIDC
    или персональным токеном endge_pat_… (раздел «Агенты» → «Токены» документации Endge).
    Операции с документами workspace требуют заголовок X-Endge-Workspace; изменение, удаление и восстановление —
    If-Match с текущей revision. Ошибки приходят как {code, message, details}; смысл каждого code и следующий шаг
    описаны в каталоге docs/error-codes.yaml репозитория github.com/endge-lab/service-backend и в разделе
    «Агенты» документации (github.com/endge-lab/configurator-docs, docs/agents). Тот же API доступен через MCP (/mcp).

securitySchemes:
  BearerAuth: |
    Authorization: Bearer <JWT access token провайдера OIDC | персональный токен endge_pat_…>.
    JWT выдаёт провайдер OIDC (например, Keycloak) при входе пользователя; права берутся из назначений Endge
    и групп токена. Персональный токен выпускает пользователь в Configurator («Для агента») или через
    POST /api/v1/access-tokens: он действует в одном workspace, имеет scope read или write, флаги commit и delete
    и срок действия; секрет показывается один раз. Без заголовка браузер использует HttpOnly cookie сессии после /auth/login.

