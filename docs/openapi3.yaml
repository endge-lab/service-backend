        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    patch:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Заменяет editable payload компонента, сохраняя id, identity,
        createdAt и deletedAt.
      tags:
        - components-legacy
      summary: Обновить компонент
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: user-card
          description: Legacy component identity
          name: component_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/component_legacy.UpdateComponentLegacyRequest"
        description: Параметры обновления компонента
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/component_legacy.ComponentLegacyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  "/api/v1/projects/{project_identity}/components-legacy/{component_identity}/hard":
    delete:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Выполняет hard-delete компонента по identity.
      tags:
