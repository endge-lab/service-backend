openapi: 3.0.0
info:
  description: Source-first API для рабочих пространств Endge, доменных
    документов, истории, коммитов и релизов.
  title: Endge Service Backend API
  contact: {}
  version: 1.0.20
paths:
  /api/session/me:
    get:
      security:
        - BearerAuth: []
      description: Возвращает локальную проекцию пользователя, признак администратору
        платформы и доступные рабочие пространства.
      tags:
        - Сессия
      summary: Получить текущую сессию
      operationId: getCurrentSession
      responses:
        "200":
          description: Текущая сессия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session.Response"
        "401":
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  /api/v1/actions:
    get:
      security:
        - BearerAuth: []
      description: Возвращает список действий текущего рабочего пространства с
        фильтрацией и пагинацией.
      tags:
        - Действия
      summary: Получить список действий
      operationId: listActions
      parameters:
        - example: default
          description: Identity рабочего пространства
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
        - description: Включить мягко удалённые документы
          name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
        - description: Identity папки
          name: folderIdentity
          in: query
          schema:
            type: string
            maxLength: 160
        - description: Фильтр по активности
          name: active
          in: query
          schema:
            type: boolean
        - description: Размер страницы
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - description: Смещение
          name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Список действий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/action.ListResponse"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "401":
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Создаёт действие в текущем рабочем пространстве.
      tags:
        - Действия
      summary: Создать действие
      operationId: createAction
      parameters:
        - example: default
          description: Identity рабочего пространства
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/action.CreateRequest"
        description: Данные нового документа
        required: true
      responses:
        "201":
          description: Документ создан
          headers:
            ETag:
              description: Текущая revision документа
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/action.Response"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "401":
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "409":
          description: Конфликт identity или revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
