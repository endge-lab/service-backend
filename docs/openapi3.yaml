    post:
      security:
        - BearerAuth: []
      description: "MCP-сервер Endge (Streamable HTTP, stateless, ответы application/json). Принимает JSON-RPC сообщения MCP: initialize, tools/list, tools/call, resources/list, resources/templates/list, resources/read. Инструменты вызывают те же use case, что REST; персональный токен ограничивает workspace, набор инструментов (scope, флаги commit и delete) и помечает изменения в истории ревизий. Accept должен содержать application/json и text/event-stream."
      tags:
        - MCP
      summary: "MCP: сообщение клиента"
      operationId: postMCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mcp.JSONRPCRequest"
            example:
              id: 1
              jsonrpc: "2.0"
              method: tools/call
        description: Сообщение JSON-RPC 2.0
        required: true
      responses:
        "200":
          description: Ответ JSON-RPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mcp.JSONRPCResponse"
              example:
                error:
                  code: -32602
                  message: unknown tool
                id: 1
                jsonrpc: "2.0"
        "202":
          description: Уведомление принято
        "400":
          description: Некорректное сообщение или заголовок Accept
          content:
            application/json:
              schema:
                type: string
        "401":
          description: "Требуется персональный токен или JWT; заголовок WWW-Authenticate: Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "403":
          description: Пользователь неактивен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "415":
          description: Content-Type должен быть application/json
          content:
            application/json:
              schema:
                type: string
    delete:
      security:
        - BearerAuth: []
      description: "Stateless MCP-сервер не выдаёт Mcp-Session-Id и отвечает 405 с Allow: POST."
      tags:
        - MCP
      summary: "MCP: завершение сессии"
      operationId: deleteMCP
      responses:
        "401":
          description: Требуется персональный токен или JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
        "405":
          description: Сессии не поддерживаются
          content:
            application/json:
              schema:
                type: string
  /version:
    get:
      description: Публичный endpoint с версией backend и доступностью подключённых backend-сервисов.
      tags:
        - Сервис
      summary: Получить версию сервиса
      operationId: getVersion
      responses:
        "200":
          description: Версия сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health.VersionResponse"
              example:
                env: development
                service: service-backend
                services:
                  - env: development
                    service: service_ai_workbench
                    status: available
                    version: 0.4.0
                version: 1.0.0
                workspaceSchemaVersion: 1
servers:
  - url: /
components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
      description: |-
        Authorization: Bearer <JWT access token провайдера OIDC | персональный токен endge_pat_…>.
        JWT выдаёт провайдер OIDC (например, Keycloak) при входе пользователя; права берутся из назначений Endge
        и групп токена. Персональный токен выпускает пользователь в Configurator («Для агента») или через
        POST /api/v1/access-tokens: он действует в одном workspace, имеет scope read или write, флаги commit и delete
        и срок действия; секрет показывается один раз. Без заголовка браузер использует HttpOnly cookie сессии после /auth/login.
  schemas:
    access_control.BulkRequest:
      type: object
      required:
        - role
        - selection
        - userId
      properties:
        role:
          description: 'Роль: viewer — чтение, editor — изменение документов, admin — управление workspace, участниками и коммитами.'
          type: string
          enum:
            - viewer
            - editor
            - admin
        selection:
          description: Какие workspace затрагивает массовое назначение.
          allOf:
            - $ref: "#/components/schemas/access_control.BulkSelectionRequest"
        userId:
          description: UUID пользователя Endge.
          type: string
    access_control.BulkResponse:
      type: object
      properties:
        affected:
          description: Сколько назначений затронуто массовой операцией.
          type: integer
        created:
          description: Сколько назначений создано массовой операцией.
          type: integer
        updated:
          description: Сколько назначений изменено массовой операцией.
          type: integer
    access_control.BulkSelectionRequest:
      type: object
      required:
        - type
        - workspaceIdentities
      properties:
        type:
          description: 'Способ выбора workspace: all-active — все активные, selected — перечисленные в workspaceIdentities.'
          type: string
          enum:
            - all-active
            - selected
        workspaceIdentities:
          description: identity выбранных workspace.
          type: array
          items:
            type: string
    access_control.GrantListResponse:
      type: object
      properties:
        items:
          description: Элементы страницы списка.
          type: array
          items:
            $ref: "#/components/schemas/access_control.GrantResponse"
        nextCursor:
          description: Курсор следующей страницы; передайте его в cursor без изменений. Пусто — страниц больше нет.
          type: string
    access_control.GrantResponse:
      type: object
      properties:
        createdAt:
          description: Время создания (RFC 3339, UTC). Заполняет сервер.
          type: string
        createdBy:
          description: Кто создал объект. Заполняет сервер; в запросах не передаётся.
          allOf:
            - $ref: "#/components/schemas/entities.Actor"
        id:
          description: Серверный UUID записи. В путях документов используется identity, а не id.
          type: string
        role:
          description: 'Роль: viewer — чтение, editor — изменение документов, admin — управление workspace, участниками и коммитами.'
          type: string
        scopeType:
          description: 'Область назначения доступа: platform или workspace.'
          type: string
        updatedAt:
          description: Время последнего изменения (RFC 3339, UTC). Заполняет сервер.
          type: string
        updatedBy:
          description: Кто последним изменил объект. Заполняет сервер.
