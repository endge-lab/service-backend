  "/api/v1/projects/{project_identity}/components-legacy/{component_identity}/restore":
    post:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Восстанавливает soft-deleted компонент по identity.
      tags:
        - components-legacy
      summary: Восстановить компонент
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: restore-user-card
          description: Legacy component identity
          name: component_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  "/api/v1/projects/{project_identity}/converters":
    get:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Возвращает неудаленные конвертеры проекта с optional фильтром папки.
      tags:
        - converters
      summary: Список конвертеров
      parameters:
