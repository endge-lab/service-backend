        - workspaceIdentity
      properties:
        commit:
          description: 'Флаг персонального токена: разрешены коммиты и релизы. Требует scope=write и роли Admin у владельца.'
          type: boolean
          example: false
        delete:
          description: 'Флаг персонального токена: разрешено удаление документов. Требует scope=write.'
          type: boolean
          example: false
        description:
          description: Описание назначения токена (до 1000 символов).
          type: string
          maxLength: 1000
          example: Правка запросов и представлений данных
        expiresAt:
          description: Время истечения токена (RFC 3339); обязателен при выпуске, не больше максимального срока.
          type: string
          format: date-time
          example: 2026-11-02T10:00:00Z
        name:
          description: Имя токена для людей (1–120 символов), например имя агента и задачи.
          type: string
          maxLength: 120
          example: "Codex: правка запросов"
        scope:
          description: read — только чтение; write — чтение и изменение документов (нужна роль Editor).
          type: string
          default: read
          enum:
