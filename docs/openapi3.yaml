openapi: 3.0.0
info:
  description: Production-ready backend Endge-сервиса с эталонными
    RedPanda-обёртками и строгими архитектурными границами.
  title: Endge Service Backend API
  contact: {}
  version: 1.0.20
paths:
  /api/session/me:
    get:
      security:
        - BearerAuth: []
      description: Возвращает информацию о JWT-сессии и локальной user-проекции сервиса.
      tags:
        - session
      summary: Получить текущую сессию
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session.SessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session.ErrorResponse"
  /api/v1/projects:
    get:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Возвращает список неудаленных проектов.
      tags:
        - projects
      summary: Список проектов
      parameters:
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.ProjectsListResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    post:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Создает новый проект.
      tags:
        - projects
      summary: Создать проект
      parameters:
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/project.CreateProjectRequest"
        description: Параметры проекта
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  "/api/v1/projects/{project_identity}":
    get:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Возвращает проект по identity.
      tags:
        - projects
      summary: Получить проект
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    delete:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Выполняет soft delete проекта по identity.
      tags:
        - projects
      summary: Удалить проект
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    patch:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Обновляет проект по identity.
      tags:
        - projects
      summary: Обновить проект
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/project.UpdateProjectRequest"
        description: Параметры обновления проекта
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  "/api/v1/projects/{project_identity}/components-legacy":
    get:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Возвращает неудаленные компоненты проекта с optional фильтрами
        папки и типа.
      tags:
        - components-legacy
      summary: Список компонентов
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: shared-components-legacy
          description: Folder identity
          name: folder_identity
          in: query
          schema:
            type: string
        - example: component-sfc
          description: Legacy component type
          name: component_type
          in: query
          schema:
            type: string
            enum:
              - component-sfc
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/component_legacy.ComponentsLegacyListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    post:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Создает component-sfc в папке проекта. Source хранится как
        authoring source и не компилируется и не выполняется.
      tags:
        - components-legacy
      summary: Создать компонент
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/component_legacy.CreateComponentLegacyRequest"
        description: Параметры компонента
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/component_legacy.ComponentLegacyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
  "/api/v1/projects/{project_identity}/components-legacy/{component_identity}":
    get:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Возвращает активный компонент по identity в пределах проекта.
