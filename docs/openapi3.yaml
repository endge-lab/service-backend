openapi: 3.0.0
info:
  description: Production-ready шаблон Endge-сервиса с эталонными
    RedPanda-обёртками и строгими архитектурными границами.
  title: Endge Service Backend API
  contact: {}
  version: 1.0.20
paths:
  /api/projects:
    get:
      security:
        - BearerAuth: []
      description: Возвращает список неудаленных проектов.
      tags:
        - projects
      summary: Список проектов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.ProjectsListResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Создает новый проект.
      tags:
        - projects
      summary: Создать проект
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_api_http_v1_project.CreateProjectRequest"
        description: Параметры проекта
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  /api/projects/count:
    get:
      security:
        - BearerAuth: []
      description: Возвращает количество неудаленных проектов.
      tags:
        - projects
      summary: Количество проектов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.CountProjectsResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  "/api/projects/identity/{identity}":
    get:
      security:
        - BearerAuth: []
      description: Возвращает проект по уникальному identity.
      tags:
        - projects
      summary: Получить проект по identity
      parameters:
        - example: swagger-project
          description: Project identity
          name: identity
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  "/api/projects/{id}":
    get:
      security:
        - BearerAuth: []
      description: Возвращает проект по UUID.
      tags:
        - projects
      summary: Получить проект по ID
      parameters:
        - example: 00000000-0000-4000-8000-000000000001
          description: Project ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
    delete:
      security:
        - BearerAuth: []
      description: Выполняет soft delete проекта.
      tags:
        - projects
      summary: Удалить проект
      parameters:
        - example: 00000000-0000-4000-8000-000000000001
          description: Project ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
    patch:
      security:
        - BearerAuth: []
      description: Обновляет проект по UUID.
      tags:
        - projects
      summary: Обновить проект
      parameters:
        - example: 00000000-0000-4000-8000-000000000001
          description: Project ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_api_http_v1_project.UpdateProjectRequest"
        description: Параметры обновления проекта
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_project.ProjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  "/api/projects/{id}/hard":
    delete:
      security:
        - BearerAuth: []
      description: Выполняет hard delete проекта из базы.
      tags:
        - projects
      summary: Удалить проект физически
      parameters:
        - example: 00000000-0000-4000-8000-000000000001
          description: Project ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  "/api/projects/{id}/restore":
    post:
      security:
        - BearerAuth: []
      description: Восстанавливает soft-deleted проект.
      tags:
        - projects
      summary: Восстановить проект
      parameters:
        - example: 00000000-0000-4000-8000-000000000001
          description: Project ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_endge-lab_service-backend_internal_api_h\
                  ttp_v1_transport.ErrorResponse"
  /api/session/me:
    get:
      security:
        - BearerAuth: []
      description: Возвращает информацию о JWT-сессии и локальной user-проекции сервиса.
      tags:
        - session
      summary: Получить текущую сессию
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_session.SessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_session.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_session.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_api_http_v1_session.ErrorResponse"
servers:
  - url: /
components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    github_com_endge-lab_service-backend_internal_api_http_v1_transport.ErrorResponse:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
          additionalProperties: {}
        message:
          type: string
    internal_api_http_v1_project.CountProjectsResponse:
      type: object
      properties:
        count:
          type: integer
          example: 42
    internal_api_http_v1_project.CreateProjectRequest:
      type: object
      required:
        - displayName
        - identity
      properties:
        allowedEnvironmentIds:
          type: array
          items:
            type: string
          example:
            - 00000000-0000-4000-8000-000000000005
        displayName:
          type: string
          maxLength: 255
          minLength: 1
          example: Swagger Project New
        extendSettings:
          type: boolean
          example: false
        folderId:
          type: string
          example: 00000000-0000-4000-8000-000000000002
        identity:
          type: string
          maxLength: 160
          minLength: 1
          example: swagger-project-new
        meta:
          type: object
        navigationId:
          type: string
          example: 00000000-0000-4000-8000-000000000004
        settingsId:
          type: string
          example: 00000000-0000-4000-8000-000000000003
    internal_api_http_v1_project.ProjectResponse:
      type: object
      properties:
        allowedEnvironmentIds:
          type: array
          items:
            type: string
          example:
            - 00000000-0000-4000-8000-000000000005
        createdAt:
          type: string
          example: 2026-07-06T14:53:00Z
        deletedAt:
          type: string
          example: 2026-07-06T14:53:00Z
        displayName:
          type: string
          example: Swagger Project
        extendSettings:
          type: boolean
          example: false
        folderId:
          type: string
          example: 00000000-0000-4000-8000-000000000002
        id:
          type: string
          example: 00000000-0000-4000-8000-000000000001
        identity:
          type: string
          example: swagger-project
        meta:
          type: object
        navigationId:
          type: string
          example: 00000000-0000-4000-8000-000000000004
        settingsId:
          type: string
          example: 00000000-0000-4000-8000-000000000003
        updatedAt:
          type: string
          example: 2026-07-06T14:53:00Z
    internal_api_http_v1_project.ProjectsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/internal_api_http_v1_project.ProjectResponse"
    internal_api_http_v1_project.UpdateProjectRequest:
      type: object
      required:
        - displayName
        - identity
      properties:
        allowedEnvironmentIds:
          type: array
          items:
            type: string
          example:
            - 00000000-0000-4000-8000-000000000005
        displayName:
          type: string
          maxLength: 255
          minLength: 1
          example: Swagger Project
        extendSettings:
          type: boolean
          example: true
        folderId:
          type: string
          example: 00000000-0000-4000-8000-000000000002
        identity:
          type: string
          maxLength: 160
          minLength: 1
          example: swagger-project
        meta:
          type: object
        navigationId:
          type: string
          example: 00000000-0000-4000-8000-000000000004
        settingsId:
          type: string
          example: 00000000-0000-4000-8000-000000000003
    internal_api_http_v1_session.ErrorResponse:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
          additionalProperties: {}
        message:
          type: string
    internal_api_http_v1_session.SessionInfoResponse:
      type: object
      properties:
        app:
          type: string
        expiresAt:
          type: string
        id:
          type: string
        platform:
          type: string
        scope:
          type: array
          items:
            type: string
        sessionId:
          type: string
    internal_api_http_v1_session.SessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/internal_api_http_v1_session.SessionInfoResponse"
        user:
          $ref: "#/components/schemas/internal_api_http_v1_session.UserResponse"
    internal_api_http_v1_session.UserResponse:
      type: object
      properties:
        authUserId:
          type: string
        createdAt:
          type: string
        displayName:
          type: string
        id:
          type: string
        role:
          type: string
        updatedAt:
          type: string
        username:
          type: string
