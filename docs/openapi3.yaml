          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    post:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Создает конвертер с JSON source/config. Source не исполняется.
      tags:
        - converters
      summary: Создать конвертер
      parameters:
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/converter.CreateConverterRequest"
        description: Параметры конвертера
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/converter.ConverterResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
