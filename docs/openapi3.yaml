          required: true
          schema:
            type: string
        - example: user-card
          description: Legacy component identity
          name: component_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/component_legacy.ComponentLegacyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
