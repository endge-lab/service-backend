        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shared.ErrorResponse"
  /auth/callback:
    get:
      description: Обменивает authorization code, сохраняет серверную сессию и
        устанавливает HttpOnly cookie.
      tags:
        - Авторизация
      summary: Завершить вход в Configurator
      operationId: configuratorAuthCallback
      parameters:
        - description: OIDC state
          name: state
          in: query
          required: true
          schema:
            type: string
        - description: Authorization code
          name: code
          in: query
          required: true
          schema:
            type: string
        - description: Ошибка внешнего провайдера
          name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Перенаправление в Configurator
        "401":
          description: Вход отклонён
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /auth/login:
    get:
      description: Перенаправляет браузер на внешний OIDC-провайдер или dev-адаптер.
      tags:
        - Авторизация
      summary: Начать вход в Configurator
      operationId: configuratorLogin
      parameters:
        - description: Безопасный URL возврата после входа
          name: returnTo
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Перенаправление на провайдера
        "503":
          description: Провайдер временно недоступен
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /auth/logout:
    post:
      description: Удаляет серверную сессию и при поддержке уведомляет внешний провайдер.
      tags:
        - Авторизация
      summary: Выйти из Configurator
      operationId: configuratorLogout
      responses:
        "204":
          description: Сессия завершена
  /health:
    get:
      description: Публичный liveness endpoint с именем сервиса, версией и окружением
        запуска.
      tags:
        - Сервис
      summary: Проверить работоспособность сервиса
      operationId: getHealth
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health.HealthResponse"
  /version:
    get:
      description: Публичный endpoint с именем сервиса, версией сборки и окружением запуска.
      tags:
        - Сервис
      summary: Получить версию сервиса
      operationId: getVersion
      responses:
        "200":
          description: Версия сервиса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health.VersionResponse"
