        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/respond.ErrorResponse"
    delete:
      security:
        - BearerAuth: []
          WorkspaceAuth: []
      description: Выполняет soft-delete компонента по identity.
      tags:
        - components-legacy
      summary: Удалить компонент
      parameters:
        - example: demo-project
          description: Project identity
          name: project_identity
          in: path
          required: true
          schema:
            type: string
        - example: user-card
          description: Legacy component identity
          name: component_identity
          in: path
          required: true
          schema:
            type: string
        - example: demo-workspace
          description: Workspace identity
          name: X-Endge-Workspace
          in: header
          required: true
          schema:
            type: string
      responses:
