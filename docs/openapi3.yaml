            - admin
        scopeType:
          description: 'Область назначения доступа: platform или workspace.'
          type: string
          enum:
            - platform
            - workspace
        userId:
          description: UUID пользователя Endge.
          type: string
        workspaceIdentity:
          description: identity workspace.
          type: string
