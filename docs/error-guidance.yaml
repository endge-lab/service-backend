# Словарь смыслов кодов ошибок backend (поддерживается вручную).
#
# Для каждого кода, который создаётся в исходниках, нужна запись в codes:
#   meaning — что произошло (коротко, по коду);
#   action  — что делать агенту: исправить запрос, перечитать и повторить, попросить пользователя, не повторять.
# Похожие коды берут общий текст из templates через use; собственные meaning/action перекрывают шаблон.
# status указывается только там, где HTTP-статус задаётся во время выполнения.
#
# `make docs` запускает internal/tools/errorcatalog: он падает, если код из исходников не описан здесь
# или здесь описан код, которого больше нет. Результат — docs/error-codes.yaml.
#
# Общий формат ошибки: HTTP {code, message, details}; MCP-инструмент {error, status, message, details, hint}.
# Повтор без изменений имеет смысл только там, где это сказано в action.

templates:
  fix-field:
    meaning: "Значение поля запроса не прошло проверку."
    action: >-
      Не повторяйте запрос без изменений. Исправьте поле, названное в message (и в details.field, если оно есть),
      по схеме операции в OpenAPI и отправьте запрос снова.
  fix-query:
    meaning: "Параметр строки запроса имеет недопустимое значение."
    action: >-
      Исправьте параметр запроса, названный в message, по описанию параметра в OpenAPI и повторите запрос.
  fix-source:
    meaning: "Исходный текст документа (source) или его sourceVersion не соответствуют контракту коллекции."
    action: >-
      Передайте непустой source и sourceVersion, которые поддерживает коллекция (см. схему CreateRequest/PatchRequest
      и описание коллекции в документации), затем повторите запрос.
  fix-auth-profile:
    meaning: "Конфигурация или учётные данные профиля аутентификации не подходят выбранному адаптеру."
    action: >-
      Сверьте adapterId, config и credentials с описанием адаптера в документации профилей аутентификации,
      исправьте названное в message поле и повторите. Секреты передавайте только в credentials.
  fix-folder:
    meaning: "Запрос нарушает правила папок (область, тип коллекции, родитель, системные поля)."
    action: >-
      Перечитайте папку и её родителя (GET /api/v1/folders), исправьте поле из message и повторите.
      Системные и корневые папки менять нельзя — создайте свою папку.
  fix-facet:
    meaning: "Запрос нарушает правила фасетов."
    action: >-
      Исправьте поле из message по схеме фасета в OpenAPI и повторите; перед повтором при необходимости
      перечитайте список фасетов (GET /api/v1/facets).
  not-found:
    meaning: "Запрошенная сущность не найдена в текущем workspace, удалена или недоступна этому пользователю."
    action: >-
      Не повторяйте с тем же значением. Проверьте identity/id по списку (для удалённых — includeDeleted=true)
      и workspace в X-Endge-Workspace; затем повторите с правильным значением.
  workspace-role:
    meaning: "Роли пользователя (или токена) в workspace недостаточно для операции."
    action: >-
      Не повторяйте. Проверьте роль через GET /api/session/me (MCP: endge_status). Попросите пользователя
      выдать нужную роль или выполнить операцию самому.
  platform-role:
    meaning: "Операция требует роли Platform Admin."
    action: >-
      Не повторяйте. Попросите пользователя с ролью Platform Admin выполнить операцию или выдать роль.
  token-restricted:
    meaning: "Персональный токен (endge_pat_…) не даёт права на эту операцию."
    action: >-
      Не повторяйте с этим токеном. Покажите пользователю, что нужно сделать, и попросите выполнить операцию
      в Configurator или выпустить токен с нужными флагами («Для агента» в Configurator).
  token-reissue:
    meaning: "Персональный токен больше не принимается."
    action: >-
      Не повторяйте с этим токеном. Попросите пользователя выпустить новый персональный токен в Configurator
      и передайте его в Authorization: Bearer endge_pat_….
  token-field:
    meaning: "Параметры выпуска персонального токена некорректны."
    action: >-
      Исправьте поле из message (name, description, scope, flags, expiresAt) по схеме access_token.CreateRequest
      и повторите выпуск.
  external-access:
    meaning: "Права из токена внешнего провайдера (OIDC) не удалось применить к запросу."
    action: >-
      Не повторяйте с тем же access token. Получите у провайдера новый access token (повторный вход в браузере
      или обновление токена) и повторите запрос; при повторе ошибки сообщите пользователю.
  auth-required:
    meaning: "Запрос не аутентифицирован или аутентификация недействительна."
    action: >-
      Передайте Authorization: Bearer <JWT access token провайдера OIDC | персональный токен endge_pat_…>.
      Если токен уже передан — он просрочен или недействителен: получите новый (для браузера — loginUrl из ответа).
  import-plan:
    meaning: "План импорта workspace больше нельзя применить."
    action: >-
      Не повторяйте применение этого плана. Создайте новый план импорта, проверьте его и примените.
  internal:
    meaning: "Неожиданная ошибка сервера; причина записана в журнал backend и в ответ не передаётся."
    action: >-
      Не меняйте запрос ради исправления. Для чтения можно повторить один раз через несколько секунд;
      перед повтором изменения сначала перечитайте состояние, чтобы не применить его дважды. Если ошибка
      повторяется, сообщите пользователю code, операцию и время.
  data-corrupted:
    meaning: "Сохранённые данные (снимок, план или метаданные) не прошли внутреннюю проверку."
    action: >-
      Не повторяйте: результат не изменится. Сообщите пользователю code, операцию и identity объекта —
      нужна диагностика на стороне сервера.
  upstream-unavailable:
    meaning: "Зависимый сервис временно недоступен или не ответил вовремя."
    action: >-
      Повторите позже с паузой (например, 2, 5, 15 секунд); не более 3 попыток. Если не помогло — сообщите пользователю.
  upstream-invalid:
    meaning: "Зависимый сервис вернул некорректный ответ."
    action: >-
      Повторите один раз; при повторе ошибки не продолжайте и сообщите пользователю code и операцию.
  backend-connection-field:
    meaning: "Параметры backend-подключения некорректны."
    action: >-
      Исправьте name или baseUrl (абсолютный http/https URL без userinfo, query и fragment) и повторите.

dynamic:
  - file: internal/adapter/mockgenerator/client.go
    function: mapError
    note: >-
      Mock Generator передаёт собственный код в gRPC ErrorInfo (domain mockdata.v1, reason); backend отдаёт его как code
      без изменений, статус выводится из gRPC-кода (400, 404, 409, 413, 429, 499, 502, 503, 504). Без ErrorInfo
      используется mock.upstream_error. Смысл таких кодов описан в документации Mock Generator.

codes:
  # --- Управление доступом ---
  access_grant_id_invalid:
    use: fix-field
    meaning: "Идентификатор назначения доступа не является UUID."
  access_grant_not_found:
    use: not-found
    meaning: "Назначение доступа с таким id не найдено."
  access_managed_externally:
    meaning: "Права доступа этого пользователя или workspace назначаются внешней системой (группы провайдера OIDC)."
    action: "Не повторяйте. Попросите администратора изменить группы пользователя в провайдере идентификации; после этого пользователь должен войти заново."
  access_scope_invalid:
    use: fix-field
    meaning: "scopeType назначения должен быть platform или workspace."
  access_target_not_found:
    use: not-found
    meaning: "Пользователь или workspace для назначения доступа не найден."
  access_user_id_invalid:
    use: fix-field
    meaning: "userId должен быть UUID."
  access_workspace_missing:
    use: data-corrupted
    meaning: "Назначение доступа ссылается на недоступный workspace."
  last_platform_admin_required:
    meaning: "Нельзя снять роль с последнего Platform Admin."
    action: "Не повторяйте. Сначала назначьте Platform Admin другому пользователю, затем повторите изменение."
  platform_admin_required:
    use: platform-role
  platform_role_invalid:
    use: fix-field
    meaning: "Для scopeType=platform допустима только роль admin."
  membership_role_invalid:
    use: fix-field
    meaning: "Роль участника должна быть viewer, editor или admin."
  workspace_role_invalid:
    use: fix-field
    meaning: "Роль в workspace должна быть viewer, editor или admin."
  workspace_selection_invalid:
    use: fix-field
    meaning: "selection.type должен быть all-active или selected."
  workspace_selection_required:
    use: fix-field
    meaning: "Для selection.type=selected нужен непустой workspaceIdentities."
  user_query_too_short:
    use: fix-query
    meaning: "Строка поиска пользователей q короче 2 символов."

  # --- Персональные токены ---
  access_token_admin_forbidden:
    use: token-restricted
    meaning: "Операция требует роли Admin workspace и недоступна персональному токену."
  access_token_commit_forbidden:
    use: token-restricted
    meaning: "Токен выпущен без флага commit; коммиты и релизы токеном запрещены."
    action: "Не повторяйте. Покажите пользователю план коммита (POST /api/v1/commits/plan, MCP endge_commit_plan) и попросите закоммитить в Configurator или выпустить токен с флагом commit."
  access_token_delete_forbidden:
    use: token-restricted
    meaning: "Токен выпущен без флага delete; удаление документов запрещено."
  access_token_description_invalid:
    use: token-field
    meaning: "description токена длиннее 1000 символов."
  access_token_expired:
    use: token-reissue
    meaning: "Срок действия персонального токена истёк."
  access_token_expiry_invalid:
    use: token-field
    meaning: "expiresAt должен быть в будущем."
  access_token_expiry_required:
    use: token-field
    meaning: "Не передан обязательный expiresAt."
  access_token_expiry_too_long:
    use: token-field
    meaning: "expiresAt превышает максимальный срок жизни токена."
  access_token_flags_require_write:
    use: token-field
    meaning: "Флаги commit и delete допустимы только при scope=write."
  access_token_invalid:
    use: token-reissue
    meaning: "Персональный токен не найден или его секрет не совпадает."
  access_token_management_forbidden:
    meaning: "Персональными токенами можно управлять только из пользовательской сессии, не токеном."
    action: "Не повторяйте. Попросите пользователя выпустить или отозвать токен в Configurator."
  access_token_name_invalid:
    use: token-field
    meaning: "name токена должен содержать от 1 до 120 символов."
  access_token_not_found:
    use: not-found
    meaning: "Персональный токен с таким id не найден или принадлежит другому пользователю."
  access_token_owner_admin_required:
    use: token-restricted
    meaning: "Коммит токеном разрешён, только если владелец токена — Admin этого workspace; при выпуске токена флаг commit доступен только Admin."
    action: "Не повторяйте. Покажите пользователю план коммита (endge_commit_plan) и попросите закоммитить в Configurator; либо Admin workspace выпускает токен с флагом commit."
  access_token_revoked:
    use: token-reissue
    meaning: "Персональный токен отозван."
  access_token_route_forbidden:
    use: token-restricted
    meaning: "Раздел API закрыт для персональных токенов (управление доступом и токенами, workspaces, AI, подключения, интеграции, Bridge, импорт, резервные копии, бандлы и выгрузки релизов)."
    action: "Не повторяйте с токеном. Эту операцию выполняет пользователь в Configurator."
  access_token_scope_exceeds_role:
    use: token-field
    meaning: "Токен с scope=write может выпустить только пользователь с ролью Editor или выше в workspace токена."
    action: "Выпустите токен со scope=read или попросите пользователя получить роль Editor."
  access_token_scope_insufficient:
    use: token-restricted
    meaning: "Токен выпущен со scope=read и не разрешает изменения."
  access_token_scope_invalid:
    use: token-field
    meaning: "scope токена должен быть read или write."
  access_token_workspace_forbidden:
    meaning: "Токен выпущен для другого workspace."
    action: "Не передавайте X-Endge-Workspace (или параметр workspace в MCP) либо укажите workspace токена (его видно в GET /api/session/me и endge_status)."

  # --- Аутентификация и сессия ---
  auth.access_token_required:
    use: auth-required
    meaning: "Не передан access token (объявлено в HTTP-слое для совместимости)."
  auth.current_user_missing:
    use: auth-required
    meaning: "В контексте запроса нет текущего пользователя (запрос прошёл без аутентификации)."
  auth.identity_missing:
    use: auth-required
    meaning: "В токене нет идентификатора пользователя (sub)."
  auth.invalid_access_token:
    use: auth-required
    meaning: "Access token недействителен или просрочен (объявлено в HTTP-слое для совместимости)."
  auth_access_failed:
    meaning: "Вход в браузере завершился, но права пользователя не удалось подготовить."
    action: "Это браузерный поток /auth/*. Попросите пользователя войти повторно; при повторе ошибки — проверить группы пользователя в провайдере."
  auth_login_failed:
    meaning: "Не удалось завершить вход (обмен кода на токены у провайдера OIDC не удался или транзакция входа устарела)."
    action: "Браузерный поток /auth/*. Попросите пользователя начать вход заново (GET /auth/login)."
  auth_login_rejected:
    meaning: "Провайдер OIDC отклонил вход или вернул ошибку."
    action: "Браузерный поток /auth/*. Попросите пользователя войти заново и проверить учётную запись в провайдере."
  auth_login_unavailable:
    meaning: "Вход через провайдера OIDC временно недоступен."
    action: "Повторите вход позже; агенту с персональным токеном этот поток не нужен."
  csrf_origin_rejected:
    meaning: "Изменяющий запрос с cookie-сессией пришёл без Origin или с Origin, которого нет в списке разрешённых."
    action: "Агенту не используйте cookie: передавайте Authorization: Bearer <токен>. Из браузера запрос должен идти с разрешённого origin."
  session.auth_user_id_required:
    use: auth-required
    meaning: "В запросе нет идентификатора пользователя."
  unauthorized:
    use: auth-required
    meaning: "Нет действительной аутентификации (токен не передан, недействителен, просрочен или сессия закончилась)."
  user_inactive:
    meaning: "Пользователь деактивирован в Endge."
    action: "Не повторяйте. Попросите администратора платформы активировать пользователя."
  external_access_ambiguous:
    use: external-access
    meaning: "Два access token с одинаковым iat дают разные права; backend не может выбрать."
  external_access_expired:
    use: external-access
    meaning: "Access token истёк во время подготовки прав."
  external_access_invalid:
    use: external-access
    meaning: "Нет проверенных актуальных прав из внешнего провайдера."
  external_access_stale:
    use: external-access
    meaning: "Уже применён более новый access token этого пользователя; переданный токен устарел."
    action: "Получите у провайдера свежий access token (или обновите браузерную сессию) и повторите запрос с ним."
  external_access_workspace_inactive:
    meaning: "Права из внешнего провайдера указывают на неактивный (архивный) workspace."
    action: "Не повторяйте. Попросите администратора восстановить workspace или изменить правила доступа."

  # --- Общие категории ---
  common.conflict:
    meaning: "Состояние на сервере конфликтует с запросом."
    action: "Перечитайте затронутые сущности и повторите запрос с актуальными данными."
  common.forbidden:
    use: workspace-role
    meaning: "Недостаточно прав для операции."
  common.internal:
    use: internal
  common.invalid_input:
    use: fix-field
    meaning: "Запрос некорректен."
  common.not_found:
    use: not-found
  common.unauthorized:
    use: auth-required
  internal_error:
    use: internal
    meaning: "Неожиданная ошибка MCP-инструмента (статус 5xx); причина записана в журнал backend."
    status: 500
  not_found:
    use: not-found
    meaning: "Сущность не найдена либо маршрут не существует (message «Маршрут не найден»)."
    action: "Проверьте путь и метод по OpenAPI; для сущности — identity/id и workspace. Не повторяйте с теми же значениями."
  request_contract_missing:
    use: internal
    meaning: "Для операции не настроен контракт проверки запроса (ошибка сборки сервера)."
  snapshot_mapping_failed:
    use: internal
    meaning: "Не удалось разобрать снимок workspace в MCP-инструменте."
  transport_mapping_failed:
    use: internal
    meaning: "Не удалось сформировать ответ из данных сервера."
  validation_error:
    meaning: "Тело запроса не разобрано как JSON (details.reason) или поля не прошли проверку контракта (details.fields)."
    action: "Не повторяйте без изменений. Исправьте поля из details по схеме CreateRequest/PatchRequest операции в OpenAPI и отправьте снова."
  invalid_json:
    use: fix-field
    meaning: "Аргумент MCP-инструмента (document или changes) должен быть JSON-объектом."
  object_expected:
    use: fix-field
    meaning: "Поле из details.field должно быть JSON-объектом."
  string_array_invalid:
    use: fix-field
    meaning: "Поле из details.field должно быть массивом строк."
  read_only_field:
    use: fix-field
    meaning: "Поля автора и аудита (createdBy, updatedBy, createdAt, updatedAt и т. п.) заполняет сервер."
    action: "Уберите эти поля из тела запроса и повторите."
  managed_by_invalid:
    use: fix-field
    meaning: "managedBy должен быть user, system или integration."
  active_invalid:
    use: fix-field
    meaning: "active должен быть boolean."
  display_name_invalid:
    use: fix-field
    meaning: "displayName обязателен и не длиннее 255 символов."
  display_name_required:
    use: fix-field
    meaning: "displayName обязателен."
  identity_required:
    use: fix-field
    meaning: "identity обязателен."
  identity_too_long:
    use: fix-field
    meaning: "identity длиннее 160 символов."
  identity_conflict:
    meaning: "Документ с таким identity уже существует в коллекции workspace."
    action: "Выберите другой identity или измените существующий документ (PATCH с If-Match). Если документ удалён — восстановите его (POST …/restore)."
  path_parameter_invalid:
    use: fix-field
    meaning: "Параметр пути (details.field) должен быть URL-кодирован."
    action: "Закодируйте значение через encodeURIComponent и повторите."
  query_boolean_invalid:
    use: fix-query
    meaning: "Параметр запроса (details.field) должен быть true или false."
  snapshot_invalid:
    use: fix-query
    meaning: "Параметр snapshot должен быть boolean."
  limit_invalid:
    use: fix-query
    meaning: "limit должен быть от 1 до 500."
  pagination.limit_invalid:
    use: fix-query
    meaning: "limit вне допустимого диапазона."
  offset_invalid:
    use: fix-query
    meaning: "offset должен быть неотрицательным."
  cursor_invalid:
    use: fix-query
    meaning: "cursor повреждён или не от этого списка."
    action: "Передавайте cursor из предыдущего ответа без изменений или начните список без cursor."
  archive_cursor_invalid:
    use: fix-query
    meaning: "cursor архива workspaces повреждён."
    action: "Передавайте cursor из предыдущего ответа без изменений или начните без cursor."
  archive_limit_invalid:
    use: fix-query
    meaning: "limit архива должен быть от 1 до 200."
  query_owner_invalid:
    use: fix-query
    meaning: "owner должен быть me или all."
  collection_unsupported:
    use: fix-field
    meaning: "Коллекция не поддерживается этой операцией."
    action: "Используйте одну из коллекций из описания параметра collection (MCP) или путь коллекции из OpenAPI."
  credential_invalid:
    use: fix-field
    meaning: "Каждое значение credentials должно быть непустой строкой."
  credentials_invalid:
    use: fix-field
    meaning: "credentials должен быть объектом с именованными строковыми значениями."
