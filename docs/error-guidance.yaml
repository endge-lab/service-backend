  revision_conflict:
    meaning: "Документ изменился после вашего чтения — revision в If-Match устарела."
    action: "Перечитайте документ, заново примените свои изменения к актуальной версии и повторите с новой revision в If-Match. Не перезаписывайте чужие изменения вслепую."
  expected_revision_invalid:
    use: fix-field
    meaning: "expectedRevision (MCP) должен быть положительным числом."
    action: "Передайте текущую revision документа из поля revision последнего чтения."
  head_sequence_conflict:
    meaning: "После построения плана в workspace появились новые ревизии или коммиты — expectedHeadSequence устарел."
    action: "Заново запросите план (POST /api/v1/commits/plan или план восстановления; MCP endge_commit_plan), проверьте его и повторите с новым expectedHeadSequence."
  nothing_to_commit:
