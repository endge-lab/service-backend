services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: service-backend

    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod

    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: service_backend
      POSTGRES_DB: service_backend
      POSTGRES_SCHEMA: public
      POSTGRES_SSLMODE: disable
      POSTGRES_MIGRATIONS_ENABLED: true

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine

    container_name: service-postgres

    environment:
      POSTGRES_DB: service_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  go-mod-cache:
