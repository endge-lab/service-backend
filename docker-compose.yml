services:
  service-backend:
    container_name: service-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${APP_RUNTIME_ENV_FILE:-.env.development}
    ports:
      - "${HOST_PORT:-8080}:8080"
    expose:
      - "9090"
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - service-backend.internal
      observability:
        aliases:
          - service-backend.observability

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-service-edge}
  # This network is created by docker-compose.observability.yml.
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK:-service-observability}
