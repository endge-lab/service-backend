root = "."
tmp_dir = "tmp"

[build]
cmd = "make BIN=./tmp/main build"
bin = "tmp/main"
include_ext = ["go"]
include_file = ["VERSION"]
exclude_dir = ["tmp", "vendor", ".git", ".idea", ".vscode"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[log]
level = "debug"
time = true
