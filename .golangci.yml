version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none

  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - whitespace
    - gocyclo
    - dupl
    - gocritic
    - goconst
    - nolintlint
    - noctx
    - bodyclose
    - unparam
    - unconvert
    - goprintffuncname
    - testableexamples
    - exhaustive
    - depguard
    - forbidigo
    - copyloopvar

  settings:
    dupl:
      threshold: 150

    goconst:
      min-len: 2
      # Two repetitions are common for JSON field names in request validation.
      # A repeated domain value is useful to surface from the third occurrence.
      min-occurrences: 3
      # These are serialization and validation field names, not domain constants.
      # Keep goconst focused on repeated collection names, roles, states and policies.
      ignore-string-values:
        - '^(active|collection|configuration|data|dataMode|deletedAt|description|displayName|event|field|folderIdentity|identity|managedBy|managedById|meta|state|version)$'
      ignore-map-keys: true

    gocyclo:
      min-complexity: 20

    depguard:
      rules:
        main:
          allow:
            - $gostd
            # Explicitly list this standard-library package because depguard
            # does not expand $gostd for it in the currently used linter build.
            - go/format
            - gitlab.com/me-group5892332/
            - github.com/
            - go.opentelemetry.io/
            - go.uber.org/
            - go.yaml.in/yaml/v3
            - google.golang.org/
          deny:
            - pkg: github.com/transport/errors
              desc: use stdlib errors

    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
      - path: test/architecture/architecture_test\.go
        linters:
          - depguard
    paths:
      - bin
      - tmp
      - var
      - vendor
      - vendor.protogen
      - transport
      - mockgen.go
      - ".*mock.*\\.go$"
      - "\\.pb\\.go$"
      - "\\.pb\\.goclay\\.go$"

formatters:
  enable:
    - goimports
