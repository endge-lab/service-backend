version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none

  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - whitespace
    - gocyclo
    - dupl
    - gocritic
    - goconst
    - nolintlint
    - noctx
    - bodyclose
    - unparam
    - unconvert
    - goprintffuncname
    - testableexamples
    - exhaustive
    - depguard
    - forbidigo
    - copyloopvar

  settings:
    dupl:
      threshold: 150

    goconst:
      min-len: 2
      min-occurrences: 2

    gocyclo:
      min-complexity: 20

    depguard:
      rules:
        main:
          allow:
              - $gostd
              - gitlab.com/me-group5892332/
              - github.com/
              - go.uber.org/
              - go.opentelemetry.io/
              - google.golang.org/
          deny:
            - pkg: github.com/transport/errors
              desc: use stdlib errors

    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
      - path: test/architecture/architecture_test\.go
        linters:
          - depguard
    paths:
      - bin
      - tmp
      - var
      - vendor
      - vendor.protogen
      - transport
      - mockgen.go
      - ".*mock.*\\.go$"
      - "\\.pb\\.go$"
      - "\\.pb\\.goclay\\.go$"

formatters:
  enable:
    - goimports
